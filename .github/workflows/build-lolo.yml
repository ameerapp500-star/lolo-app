name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          Z=$(find . -type f -name 'ameer-screens-fixed.zip' -not -path './.git/*' | head -1)
          if [ -z "$Z" ]; then
            echo "ERROR: ameer-screens-fixed.zip not found"
            find . -name '*.zip' -not -path './.git/*'
            exit 1
          fi
          echo "Using $Z"
          unzip -q "$Z" -d extracted
          S=$(find extracted -name settings.gradle | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          [ -z "$S" ] && { echo "ERROR: settings.gradle not found"; find extracted | head -50; exit 1; }
          D=$(dirname "$S")
          if [ "$D" != "extracted/car-screens-main" ]; then
            rm -rf _proj && mkdir _proj
            cp -a "$D"/. _proj/
            rm -rf extracted && mkdir extracted
            mv _proj extracted/car-screens-main
          fi
          ls extracted/car-screens-main

      - name: Apply Lolo fixes to extracted source
        working-directory: extracted/car-screens-main
        run: |
          python3 "$GITHUB_WORKSPACE/patches/apply_lolo_fixes.py"

      - name: Generate Lolo source diagnostic
        working-directory: extracted/car-screens-main
        run: python3 "$GITHUB_WORKSPACE/patches/diagnose_lolo.py"

      - name: Upload Lolo source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Lolo-Source-Diagnostic
          path: /tmp/lolo-diagnostic.txt
          if-no-files-found: error

      - name: Validate web interface JavaScript
        working-directory: extracted/car-screens-main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No JavaScript found in index.html")
          Path("/tmp/ameer-index-check.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/ameer-index-check.js

      - name: Build APK
        working-directory: extracted/car-screens-main
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ameer-Screens-APK
          path: extracted/car-screens-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
