                  "      presentation = new Presentation(getCarContext(), display);\n      try { presentation.getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED); } catch (Throwable ignored) {}\n", "hw")

          c = sub(c, "Log.e(\"AmeerCarWeb\", \"Failed to attach WebView to car surface\", t); detach(); }",
                  "Log.e(\"AmeerCarWeb\", \"Failed to attach WebView to car surface\", t); startupError = \"attach: \" + t; detach(); main.post(() -> { try { invalidate(); } catch (Throwable ignored) {} }); }", "catch")

          old_tpl = "  @Override public Template onGetTemplate() {\n    return new NavigationTemplate.Builder()"
          new_tpl = ("  @Override public Template onGetTemplate() {\n"
                     "    try {\n"
                     "      if (startupError != null) {\n"
                     "        return new MessageTemplate.Builder(\"Ameer Screens error:\\n\" + startupError).setTitle(\"Ameer Screens\").build();\n"
                     "      }\n"
                     "      return buildNavTemplate();\n"
                     "    } catch (Throwable t) {\n"
                     "      Log.e(\"AmeerCarWeb\", \"onGetTemplate failed\", t);\n"
                     "      return new MessageTemplate.Builder(\"Ameer Screens error:\\n\" + t).setTitle(\"Ameer Screens\").build();\n"
                     "    }\n"
                     "  }\n\n"
                     "  private Template buildNavTemplate() {\n    return new NavigationTemplate.Builder()")
          c = sub(c, old_tpl, new_tpl, "template")
          p.write_text(c, encoding="utf-8")
          print("patched OK")
          PY

      - name: Validate original interface JavaScript
        working-directory: extracted/car-screens-main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No JavaScript found in index.html")
          Path("/tmp/ameer-index-check.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/ameer-index-check.js

      - name: Safe Android Auto fixes
        working-directory: extracted/car-screens-main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          m = Path("app/src/main/AndroidManifest.xml")
          x = m.read_text()
          x = re.sub(r'\s*android:permission="android\.permission\.BIND_MEDIA_BROWSER"', '', x)
          m.write_text(x)
          f = Path("app/src/main/java/com/carscreens/app/MapsCarAppService.java")
          j = f.read_text()
          old = "return new CarWebScreen(getCarContext());"
          new = "try { return new CarWebScreen(getCarContext()); } catch (Throwable t) { android.util.Log.e(\"AmeerCar\", \"CarWebScreen failed\", t); return new HomeScreen(getCarContext()); }"
          if old in j:
              f.write_text(j.replace(old, new, 1))
          print("safe fixes applied")
          PY

      - name: Build APK
        working-directory: extracted/car-screens-main
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ameer-Screens-APK
          path: extracted/car-screens-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
