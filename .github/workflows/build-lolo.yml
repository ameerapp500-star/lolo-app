          # Use Media3's HTTP data source for HLS, TS/MP4, and redirected IPTV URLs.
          play_start = car.find("@JavascriptInterface public void playVideo(String url) {")
          hide_start = car.find("@JavascriptInterface public void hidePlayer()", play_start)
          if play_start < 0 or hide_start < 0:
              raise SystemExit("Car native video bridge methods missing")
          play_method = """@JavascriptInterface public void playVideo(String url) {
              if (url == null || url.trim().isEmpty()) return;
              final String mediaUrl = url.trim();
              main.post(() -> {
                try {
                  if (playerView == null || web == null) throw new IllegalStateException("Car display is not ready");
                  if (carPlayer != null) { carPlayer.release(); carPlayer = null; }
                  DefaultHttpDataSource.Factory http = new DefaultHttpDataSource.Factory()
                      .setUserAgent("AmeerScreens/1.0 AndroidAuto")
                      .setAllowCrossProtocolRedirects(true);
                  DefaultDataSource.Factory data = new DefaultDataSource.Factory(context, http);
                  DefaultMediaSourceFactory sources = new DefaultMediaSourceFactory(data);
                  carPlayer = new ExoPlayer.Builder(context).setMediaSourceFactory(sources).build();
                  playerView.setUseController(true);
                  playerView.setControllerAutoShow(true);
                  playerView.setKeepContentOnPlayerReset(true);
                  playerView.setPlayer(carPlayer);
                  carPlayer.setAudioAttributes(new AudioAttributes.Builder()                      .setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true);
                  carPlayer.addListener(new Player.Listener() {                    @Override public void onPlayerError(PlaybackException error) {                      Toast.makeText(context, "تعذّر تشغيل القناة أو الفيديو: " + error.getErrorCodeName(), Toast.LENGTH_LONG).show();                      Log.e("AmeerCarWeb", "Media3 playback error", error);                    }
                  });
                  web.setVisibility(View.GONE);
                  playerView.setVisibility(View.VISIBLE);
                  carPlayer.setMediaItem(MediaItem.fromUri(Uri.parse(mediaUrl)));
                  carPlayer.prepare();
