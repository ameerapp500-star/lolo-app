                  'CarBridge bridge = new CarBridge(getCarContext(), web, main, playerView);' + chr(10) + '                activeBridge = bridge;' + chr(10) + '                web.addJavascriptInterface(bridge, "Android");', 1)

          if "static boolean openWebOnCar(String url)" not in car:
              idx = car.find("private void detach() {")
              if idx < 0: raise SystemExit("CarWebScreen detach method missing")
